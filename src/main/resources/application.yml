spring:
  application:
    name: product-inventory-api
  datasource:
    url: jdbc:h2:mem:inventory;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: ${inventory.import.max-file-size}
      max-request-size: ${inventory.import.max-file-size}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Application-specific settings. Every value can be overridden with an environment
# variable, e.g. INVENTORY_CORS_ALLOWED_ORIGINS=http://localhost:4200,http://ui:80
inventory:
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://localhost:80
      - http://localhost
  import:
    max-file-size: 5MB
    max-rows: 10000
    accepted-extensions:
      - xlsx
    date-patterns:
      - yyyy-MM-dd
      - MM/dd/yyyy
      - M/d/yyyy
      - dd-MMM-yyyy
  query:
    max-page-size: 200
